[project]
name = "claysandbox"
version = "0.1.0"
description = "Clay agent-eval sandbox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "boto3>=1.35",
    "jsonschema>=4.22",
    "pyyaml>=6.0",
    "python-ulid>=2.7",
    "strands-agents==1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-PyYAML",
    "types-jsonschema",
    "boto3-stubs[bedrock-runtime,ecs,s3,pricing]",
    "duckdb>=2.0.0",
]
infra = [
    "aws-cdk-lib>=2.150",
    "constructs>=10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claysandbox"]

[tool.pytest.ini_options]
testpaths = ["tests", "claysandbox/contracts/conformance"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
