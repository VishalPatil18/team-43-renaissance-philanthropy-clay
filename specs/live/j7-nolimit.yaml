# J7 step 2: same task with the step, token and time limits off; completes normally.
# max_usd stays as a safety net only (a missing max_usd would leave real spend unbounded).
# PLACEHOLDERS: <nova-lite-id>, <aoi-1>.
spec_version: 1
name: live-j7-nolimit
tasks:
  templates: [T1]
  aois: ["<aoi-1>"]
baseline:
  name: novalite-strands-T1-nolimit
  model:   {name: bedrock, params: {model_id: "<nova-lite-id>", temperature: 0.2, max_tokens: 2048}}
  harness: {name: strands, params: {}}
  toolset: T1
  tracer:  {name: jsonl}
variants: []
evaluators:
  - {name: workflow, version: "1"}
summary: {name: llm, params: {model_id: "<nova-lite-id>"}}
trials: 1
seed: 42
budget:
  run:  {max_usd: 0.25}
  eval: {max_usd: 1}
infra_retries: 0
executor: {name: local, params: {max_parallel: 1}}
store:    {name: local, params: {root: ./runs, mirror_s3: null}}
offline: false
