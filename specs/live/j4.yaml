# J4.1: errors are caught and logged. T1 on one instance with the faulty toolset (Vishal).
# J4.2 is specs/live/j4-wrong-tool.yaml; run both via live_journeys.sh r1.
# PLACEHOLDERS: <nova-lite-id>, <aoi-1>, and the faulty toolset name "T1-faulty" (confirm with Vishal).
spec_version: 1
name: live-j4
tasks:
  templates: [T1]
  aois: ["<aoi-1>"]
baseline:
  name: novalite-strands-T1-faulty
  model:   {name: bedrock, params: {model_id: "<nova-lite-id>", temperature: 0.2, max_tokens: 2048}}
  harness: {name: strands, params: {}}
  toolset: T1-faulty
  tracer:  {name: jsonl}
variants: []
evaluators:
  - {name: workflow, version: "1"}
  - {name: output, version: "1"}
summary: {name: llm, params: {model_id: "<nova-lite-id>"}}
trials: 1
seed: 42
budget:
  run:  {max_steps: 15, max_tokens: 40000, max_usd: 0.08, max_seconds: 120}
  eval: {max_usd: 1}
loop_guard: {max_identical_calls: 3}
infra_retries: 1
executor: {name: local, params: {max_parallel: 1}}
store:    {name: local, params: {root: ./runs, mirror_s3: null}}
offline: false
